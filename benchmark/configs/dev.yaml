# Dev-set run (plan §6.4, §6.5): Pipelines A and B on the 5 dev bugs, cheap model, cache on.
# Used while building and tuning; never part of the reported results.
name: dev
model: claude-haiku-5-5
effort: medium
max_output_tokens: 16000
prompt_version: v2
pipelines: [A, B]
trials: 1
bugs:
  - benchmark/manifests/*.yaml
max_patch_attempts: 2
max_repro_attempts: 2       # Pipeline A only
token_cap: 400000          # set from the Sonnet 5.5 measurement (DECISIONS.md)
context_budget: 250000     # characters (about 60k tokens)
cache: true                # identical requests reuse the stored answer (dev only)
evaluate: true
guard:
  max_calls_per_hour: 60
  max_calls_per_day: 400
  min_interval_s: 2.0
