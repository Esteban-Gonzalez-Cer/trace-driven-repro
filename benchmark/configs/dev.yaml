# Dev-set run (plan §6.4): Pipeline B on the 5 dev bugs, cheap model, cache on.
# Used while building and tuning; never part of the reported results.
name: dev
model: claude-haiku-5-5
effort: medium
max_output_tokens: 16000
prompt_version: v1
pipelines: [B]
trials: 1
bugs:
  - benchmark/manifests/*.yaml
max_patch_attempts: 2
token_cap: 150000          # provisional; set from measurements in step 6
context_budget: 120000     # characters
cache: true                # identical requests reuse the stored answer (dev only)
evaluate: true
guard:
  max_calls_per_hour: 60
  max_calls_per_day: 400
  min_interval_s: 2.0
