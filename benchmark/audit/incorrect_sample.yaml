    raises.
- trial: more-itertools-1294/B/2
  decision: not_a_fix
  evidence: read
  note: Re-raises StopIteration without its context; each peek on a zero-size cache still leaks
    memory (the bug).
- trial: starlette-3619/A/2
  decision: real_fix
  evidence: ran
  note: Compares the two multi-dicts as unordered multisets, which removes the TypeError and keeps
    the library's previous rule (before the fix, swapped values for one key also compared equal).
    The oracle asserts the maintainers' new rule that the order of values within a key matters,
    a design choice the crash report does not reveal.
- trial: starlette-3783/A/1
  decision: real_fix
  evidence: ran
  note: Raises the intended ValueError instead of the AttributeError, but names the cast with
    repr(), giving "Not a valid functools.partial(<class 'int'>, base=16)." where the oracle
    matches the exact text "Not a valid partial.".
