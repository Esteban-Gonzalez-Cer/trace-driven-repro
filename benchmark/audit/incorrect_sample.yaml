# Manual audit of a random sample of patches graded incorrect (spec §7.5, Phase 5 step P5.4).
# Population: trials graded incorrect that produced a patch (46). Sample: 25%, rounded up (12),
# drawn by `tracerepro.analysis.audit.draw_sample` with the seed below; `make analyze` checks
# that this list matches a fresh draw.
# decision: real_fix (the grader rejected a patch that does fix the bug: a false negative)
#           | not_a_fix (the rejection is right)
# evidence: what the decision rests on; "ran" = the patched code was run in the bug's image
# (no network) on the call in the crash report.
run_id: final-935ffcd2-v2-claude-sonnet-5-5-cli2.1.308
reviewer: claude-opus-5-5
seed: 20261111
fraction: 0.25
sample:
- trial: flask-5797/A/2
  decision: not_a_fix
  evidence: read
  note: Makes session["missing"] return None instead of raising KeyError, which hides the error; the
    real bug (preserved request contexts re-pushed in the wrong order) is untouched, so the session
    value set after the redirect is still lost.
- trial: flask-5797/B/1
  decision: not_a_fix
  evidence: read
  note: Adds a comment only; no behaviour changes.
- trial: marshmallow-2901/A/1
  decision: not_a_fix
  evidence: read
  note: Sets required=True back after construction, so loading without the field now fails with
    "Missing data for required field" instead of returning the constant.
- trial: marshmallow-2994/A/3
  decision: not_a_fix
  evidence: ran
  note: Deserializing None returns the enum member whose value is None (U.nothing) instead of None,
    and does so even when allow_none=False was given explicitly, so it overrides the user's
    setting.
- trial: marshmallow-2994/B/1
  decision: not_a_fix
