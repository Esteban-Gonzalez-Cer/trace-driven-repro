# Manual audit of a random sample of patches graded incorrect, second study (Phase 5b).
# Population: trials graded incorrect that produced a patch (56). Sample: 25%, rounded up (14),
# drawn by `tracerepro.analysis.audit.draw_sample` with the seed below; `make analyze` checks
# that this list matches a fresh draw.
# decision: real_fix (the grader rejected a patch that does fix the bug: a false negative)
#           | not_a_fix (the rejection is right)
# evidence: what the decision rests on; "read" = the patch read next to the maintainers' fix
# and the oracle tests.
