[project]
name = "tracerepro"
version = "0.0.1"
description = "Benchmark harness: LLM crash reproduction and patching from Python stack traces"
readme = "README.md"
license = "MIT"
authors = [{ name = "Esteban Gonzalez Cervantes" }]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-docker>=7.2.0.20261006",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracerepro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture test files are run by harness tests in a subprocess, never collected directly.
norecursedirs = ["tests/fixtures"]
addopts = "-p no:cacheprovider -ra"
markers = [
    "docker: needs a running Docker daemon (skipped otherwise)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["tests/fixtures/"]
