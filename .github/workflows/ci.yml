name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not docker"

  analyze:
    # Every table and figure must come from the committed results (plan §8.2): rebuild them on a
    # clean checkout, with no Docker, keys or model, and fail if anything differs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: make analyze
      - run: git status --porcelain results/ && test -z "$(git status --porcelain results/)"

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: docker pull python:3.11-slim
      - run: uv run pytest -m "docker and not realbugs"

  known-answer-bugs:
    # The list of validated bugs, one CI job per bug below.
    runs-on: ubuntu-latest
    outputs:
      bugs: ${{ steps.list.outputs.bugs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: list
        run: |
          echo "bugs=$(ls benchmark/manifests/*.yaml | xargs -n1 basename | sed 's/.yaml$//' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  known-answer:
    # Known-answer tests on every validated benchmark bug (plan §5.5): clones upstream at the
    # pinned commits and builds the bug_env image, so it needs network and Docker. One job per
    # bug: all of them in one job no longer fit in a time limit.
    needs: known-answer-bugs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bug: ${{ fromJson(needs.known-answer-bugs.outputs.bugs) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -m realbugs -ra
        env:
          TRACEREPRO_BUG: ${{ matrix.bug }}

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
